<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenDash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16181B"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <!-- KTM orange range -->
    <linearGradient id="orange" x1="150" y1="410" x2="360" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E65C00"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="arrowLight" x1="256" y1="130" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#FF6600"/>
    </linearGradient>
    <linearGradient id="arrowDark" x1="256" y1="130" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E65C00"/>
      <stop offset="1" stop-color="#C24D00"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" stroke="#000000" stroke-opacity="0.35"/>

  <!-- speedometer / dash arc: ~250 deg sweep, open at the bottom -->
  <path d="M136 360 A160 160 0 1 1 376 360"
        fill="none" stroke="#2A2D31" stroke-width="26" stroke-linecap="round"/>
  <!-- lit portion of the gauge -->
  <path d="M136 360 A160 160 0 0 1 142.86 141.03"
        fill="none" stroke="url(#orange)" stroke-width="26" stroke-linecap="round"/>

  <!-- upward navigation arrow: two faceted halves with a notched base -->
  <path d="M256 138 L178 344 L256 302 Z"
        fill="url(#arrowLight)" stroke="url(#arrowLight)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M256 138 L334 344 L256 302 Z"
        fill="url(#arrowDark)" stroke="url(#arrowDark)" stroke-width="12" stroke-linejoin="round"/>
</svg>
